<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome On Board | OMMFA</title>

  <link rel="icon" type="image/png" href="https://ommfa.org/assets/images/favicon.png">
  <link rel="apple-touch-icon" href="https://ommfa.org/assets/images/favicon.png">

  <meta name="robots" content="noindex, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .confirm-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .confirm-container h1 {
      font-size: 1.6rem;
      margin-bottom: 1.25rem;
      line-height: 1.3;
    }
    .confirm-container p {
      color: var(--ink-soft);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .confirm-container a {
      border-bottom: 1px solid var(--ink);
      color: var(--ink);
      text-decoration: none;
    }
    .confirm-meta {
      font-size: 0.85rem;
      color: var(--ink-soft);
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

<main class="confirm-container">
    <h1>Welcome On Board</h1>
    <p>
      Your contribution to THE WAY has been received.
    </p>
    <p>
      The OMMFA team will be in touch by email regarding install and exhibition details. THE WAY runs 15–19 September 2026 at the Old Waiting Room,
      Peckham Rye Station, during London Design Festival 2026.
    </p>
    <a href="index.html">Return to OMMFA</a>
  </main>

  <div id="footer-mount"></div>
  <script src="js/site.js"></script>

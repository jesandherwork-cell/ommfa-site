<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human | OMMFA</title>

  <link rel="icon" type="image/png" href="https://ommfa.org/assets/images/favicon.png">
  <link rel="apple-touch-icon" href="https://ommfa.org/assets/images/favicon.png">

  <meta property="og:image" content="https://ommfa.org/assets/images/og-default.webp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="OMMFA">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://ommfa.org/assets/images/og-default.webp">

  <meta name="description" content="Artists, writers and collaborators working with OMMFA across exhibitions, publications and projects.">
  <link rel="canonical" href="https://ommfa.org/human" />
  <meta property="og:title" content="Human | OMMFA">
  <meta property="og:description" content="The artists, writers and collaborators working with OMMFA.">
  <meta property="og:url" content="https://ommfa.org/human">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- class 仍是 page-artist：style.css 里有 7 条规则挂在这个类上（背景、卡片、标题色），
     改名要连同 CSS 一起动，收益为零。data-page 改成 human，导航高亮才对得上。 -->
<body class="page-artist" data-page="human">

  <div id="nav-mount"></div>

  <div class="filter-bar">

   <div class="filter-side">

    <!-- View 的按钮由 artist-page.js 从 artists.js 的 roles 字段自动生成，
         这里只留一个空壳。加新身份不用改这里。 -->
    <div class="filter-group" id="role-filter"></div>

    <div class="filter-group">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Type a name…"
        autocomplete="off"
        aria-label="Search by name"
      >
    </div>

   </div>

    <div class="filter-group">
      <span class="filter-label">Sort</span>
      <button class="sort-btn active" data-sort="random">Random</button>
      <button class="sort-btn" data-sort="az">A–Z</button>
      <button class="filter-btn" id="available-btn">Available</button>
    </div>
  </div>

  <p class="filter-note" id="available-note" hidden>
    Open to enquiries. Contact details are in each file.
  </p>

  <main class="grid" id="artist-grid"></main>

  <div id="footer-mount"></div>

  <div id="envelope-overlay" class="envelope-overlay" aria-hidden="true">
    <button class="envelope-close" aria-label="Close">✕</button>
    <div class="envelope">
      <div class="envelope-inner"></div>

      <div class="envelope-inspector" aria-hidden="true">
        <img class="inspected-image" src="" alt="">
        <p class="inspector-hint">Click anywhere to put it back</p>
      </div>
    </div>
  </div>

  <script src="https://player.vimeo.com/api/player.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>

  <script src="js/site.js"></script>
  <script src="js/newsletter.js"></script>
  <script src="js/artists.js"></script>
  <script src="js/exhibitions.js"></script>
  <script src="js/poster-particles.js"></script> 
  <script src="js/artist-envelope.js"></script>
  <script src="js/bio-scroller.js"></script>
  <script src="js/artist-page.js"></script>
</body>
</html>
